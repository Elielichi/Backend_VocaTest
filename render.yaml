services:
  - type: web
    name: vocatest-api
    runtime: node
    rootDir: Backend proyecto
    buildCommand: npm ci
    preDeployCommand: npm run db:migrate && npm run db:seed-test
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PGSSL
        value: false
